name: NEXUS Ingest

on:
  schedule:
    - cron: '* * * * *'   # every minute — Edge Function dedupes if <80s since last run
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger ingest
        run: |
          curl -sf -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 90 \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /tmp/ingest_out.json
          cat /tmp/ingest_out.json

      - name: Log result
        if: always()
        run: echo "Ingest run at $(date -u)"
