name: NEXUS VOX Engine

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

jobs:
  vox:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Score markets
        run: |
          curl -sf -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/vox-engine" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 60 \
            -w "\nHTTP %{http_code}\n"
